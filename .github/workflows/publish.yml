name: Publish plugin to ghcr.io

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn tsc && yarn build && npx --yes @red-hat-developer-hub/cli@1.10.8 plugin export

      - name: Read version from package.json
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Package dynamic plugin
        run: npx --yes @red-hat-developer-hub/cli@1.10.8 plugin package --tag "$IMAGE_NAME:${{ steps.version.outputs.version }}"

      - name: Tag as latest
        run: podman tag "$IMAGE_NAME:${{ steps.version.outputs.version }}" "$IMAGE_NAME:latest"

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push images
        run: |
          podman push "$IMAGE_NAME:${{ steps.version.outputs.version }}"
          podman push "$IMAGE_NAME:latest"
